# Modified from https://github.com/epics-containers/ec-phoebus/blob/main/.github/workflows/buiild.yml
name: Build and publish phoebus image to ghcr.io/diamondlightsource

on:
  push:
    branches:
      - development
    tags:

jobs:
  configure-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Determine container image tag to use
        id: tag
        run: |
          # tag is branch name or tag if there is a tag
          echo ::set-output name=image_tag::${GITHUB_REF##*/}
          echo ::set-output name=do_push::true

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/diamondlightsource
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

  build-developer-image:
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    needs: configure-image
    permissions:
      contents: read
      packages: write

    steps:
    - name: Build developer image
      uses: docker/build-push-action@v6
      with:
        file: ./dls/Dockerfile
        builder: ${{ needs.configure-image.outputs.name }}
        push: ${{ needs.configure-image.outputs.do_push }}
        tags: |
          ghcr.io/${{ github.repository }}:${{ needs.configure-image.outputs.image_tag }}
        cache-from: type=gha,scope=build
        cache-to: type=gha,mode=max,scope=build

  build-tagged-image:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: configure-image
    permissions:
      contents: read
      packages: write

    steps:
    - name: Build runtime image
      uses: docker/build-push-action@v6
      with:
        file: ./dls/Dockerfile
        builder: ${{ needs.configure-image.outputs.name }}
        push: ${{ needs.configure-image.outputs.do_push }}
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ needs.configure-image.outputs.image_tag }}
        target: runtime
        cache-from: type=gha,scope=build
        cache-to: type=gha,mode=max,scope=build
