# Modified from https://github.com/epics-containers/ec-phoebus/blob/main/.github/workflows/buiild.yml
name: Phoebus docker build and push CI

on:
  push:
    branches:
      - development
    tags:
      - '**'

env:
  REPOSITORY: diamondlightsource/phoebus # Must be lowercase for ghcr

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Determine container image tag to use
        id: tag
        run: |
          # tag is branch name or tag if there is a tag
          echo "image_tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          echo "do_push=true" >> "$GITHUB_OUTPUT"

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/diamondlightsource
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build developer image
        if: github.ref_name == 'development'
        uses: docker/build-push-action@v6
        with:
          file: ./dls/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ steps.tag.outputs.do_push }}
          tags: |
            ghcr.io/${{ env.REPOSITORY }}:${{ github.ref_name }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build

      - name: Build release image
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          file: ./dls/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ steps.tag.outputs.do_push }}
          tags: |
            ghcr.io/${{ env.REPOSITORY }}:latest
            ghcr.io/${{ env.REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
          target: runtime
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build
